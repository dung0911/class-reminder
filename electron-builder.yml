appId: com.lichhoc.app
productName: Lịch học
directories:
  output: dist
files:
  - out/**/*
  - package.json
# File ngôn ngữ đi kèm app nằm ở thư mục locales cạnh app (đọc lúc chạy)
extraResources:
  - from: resources/locales
    to: locales
win:
  target:
    - nsis
  # Tên file cài chỉ dùng chữ không dấu để tránh lỗi ở một số máy
  artifactName: LichHoc-Setup-${version}.${ext}
  # Không ký và không chỉnh icon/thông tin file .exe. Bước đó cần quyền tạo symlink của Windows
  # (Developer Mode hoặc chạy bằng quyền Admin). Bật lại khi đã có icon và chứng chỉ ký.
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
# Tự cập nhật qua GitHub Releases: bật khi đã có repo
# publish:
#   provider: github
#   owner: <tên-github>
#   repo: lich-hoc
